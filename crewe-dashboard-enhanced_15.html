<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crewe Alexandra Recruitment Dashboard</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }

.container { display: flex; height: 100vh; background: #f5f5f5; }
.sidebar { width: 340px; border-right: 1px solid #ddd; display: flex; flex-direction: column; background: white; overflow: hidden; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.header { padding: 18px; background: white; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
.header-left { flex: 1; }
.header h1 { margin: 0 0 4px 0; font-size: 20px; font-weight: 600; }
.header p { margin: 0; font-size: 12px; color: #666; }
.refresh-btn { padding: 8px 14px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
.refresh-btn:hover { background: #0052a3; }

.controls { padding: 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #ddd; }
.search-box input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
.filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.filter-row select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }

.player-list { flex: 1; overflow-y: auto; padding: 6px; }
.player-item { padding: 10px; margin-bottom: 6px; background: white; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
.player-item:hover { border-color: #0066cc; background: #f9f9f9; }
.player-item.active { background: #e8f4f8; border-color: #0066cc; }

.player-name { font-weight: 600; font-size: 12px; }
.player-meta { font-size: 11px; color: #666; margin-top: 3px; }
.report-count { display: inline-block; background: #0066cc; color: white; padding: 2px 6px; border-radius: 2px; font-size: 10px; font-weight: 600; }

.detail-panel { padding: 24px; overflow-y: auto; background: white; }
.detail-panel h2 { margin: 0 0 16px 0; font-size: 22px; font-weight: 600; }

.tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid #eee; }
.tab { padding: 10px 16px; cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; color: #666; }
.tab.active { border-bottom-color: #0066cc; color: #0066cc; font-weight: 600; }

.tab-content { display: none; }
.tab-content.active { display: block; }

.player-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { padding: 12px; background: linear-gradient(135deg, #0066cc, #0052a3); color: white; border-radius: 4px; text-align: center; }
.stat-card .label { font-size: 11px; opacity: 0.9; }
.stat-card .value { font-size: 20px; font-weight: 600; margin-top: 4px; }

.reports-container { }
.report-card { padding: 14px; background: #f9f9f9; border: 1px solid #e0e0e0; border-left: 4px solid #0066cc; border-radius: 4px; margin-bottom: 12px; }
.report-card.unassigned { border-left-color: #ff6b6b; background: #fff5f5; }
.report-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.report-scout { font-weight: 600; font-size: 12px; }
.report-date { font-size: 11px; color: #666; }
.report-position { display: inline-block; background: #e3f2fd; color: #1976d2; padding: 2px 6px; border-radius: 2px; font-size: 10px; margin-top: 4px; }

.report-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0; font-size: 11px; }
.detail-item { }
.detail-label { color: #666; margin-bottom: 2px; }
.detail-value { font-weight: 600; }

.verdict-badge { display: inline-block; padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; margin-top: 8px; }
.verdict-sign { background: #c8e6c9; color: #2e7d32; }
.verdict-watch { background: #fff3cd; color: #856404; }
.verdict-forget { background: #f8d7da; color: #721c24; }
.verdict-squad { background: #d1ecf1; color: #0c5460; }

.report-weight { font-size: 10px; color: #0066cc; font-weight: 600; margin-top: 8px; }
.report-comments { font-size: 11px; margin-top: 8px; padding: 8px; background: white; border-radius: 3px; max-height: 80px; overflow-y: auto; }

.empty-state { text-align: center; padding: 40px 20px; color: #999; }
.loading { text-align: center; padding: 20px; color: #999; }

button { padding: 8px 16px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
button:hover { background: #0052a3; }
button:disabled { background: #ccc; cursor: not-allowed; }

@media (max-width: 768px) {

  .sidebar { width: 100%; height: 30vh; }

.stat-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.stat-bar-container { flex: 1; }
.stat-label { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.stat-bar { height: 24px; background: linear-gradient(90deg, #ef5350 0%, #ffa726 50%, #66bb6a 100%); border-radius: 12px; position: relative; }
.stat-bar-value { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: 600; font-size: 11px; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
.stat-percentile { font-size: 11px; color: #666; margin-top: 2px; }
</style>

async function fetchPlayers() {
  try {
    let allPlayersData = [];
    let offset = 0;
    const pageSize = 1000;
    let hasMore = true;
    
    while (hasMore) {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/players?limit=${pageSize}&offset=${offset}`,
        {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          }
        }
      );
      
      if (!response.ok) {
        console.error('Players response error:', response.status);
        break;
      }
      
      const data = await response.json();
      console.log(`Players batch ${offset/pageSize + 1}: ${data.length} records`);
      
      if (!Array.isArray(data) || data.length === 0) {
        hasMore = false;
      } else {
        allPlayersData = allPlayersData.concat(data);
        offset += pageSize;
        if (data.length < pageSize) hasMore = false;
      }
    }
    
    console.log('Total players fetched:', allPlayersData.length);
    allPlayers = allPlayersData;
    return allPlayersData;
  } catch (e) {
    console.error('Error fetching players:', e);
    return [];
  }
}

async function fetchReports() {
  try {
    let allReportsData = [];
    let offset = 0;
    const pageSize = 1000;
    let hasMore = true;
    let batchNum = 1;
    
    while (hasMore) {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/reports?limit=${pageSize}&offset=${offset}`,
        {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          }
        }
      );
      
      if (!response.ok) {
        console.error('Reports response error:', response.status);
        break;
      }
      
      const data = await response.json();
      console.log(`Reports batch ${batchNum}: ${data.length} records (offset: ${offset})`);
      
      if (!Array.isArray(data) || data.length === 0) {
        hasMore = false;
      } else {
        allReportsData = allReportsData.concat(data);
        offset += pageSize;
        batchNum++;
        if (data.length < pageSize) hasMore = false;
      }
    }
    
    console.log('Total reports fetched:', allReportsData.length);
    allReports = allReportsData;
    return allReportsData;
  } catch (e) {
    console.error('Error fetching reports:', e);
    return [];
  }
}

function getReportsForPlayer(playerName) {
  try {
    if (!playerName) return [];
    return allReports.filter(r => 
      r.player_name && r.player_name.toLowerCase() === playerName.toLowerCase()
    ).sort((a, b) => {
      const dateA = new Date(a.fixture_date || 0);
      const dateB = new Date(b.fixture_date || 0);
      return dateB - dateA;
    });
  } catch (e) {
    console.error('Error filtering reports:', e);
    return [];
  }
}

function debugFindReports(searchName) {
  const matches = allReports.filter(r => 
    r.player_name && r.player_name.toLowerCase().includes(searchName.toLowerCase())
  );
  console.log(`Reports containing "${searchName}":`, matches.length);
  matches.forEach(m => {
    console.log(`  - "${m.player_name}" (exact match: ${m.player_name.toLowerCase() === searchName.toLowerCase()})`);
  });
  return matches;
}

function getPlayerName(player) {
  return player.player || player.name || player.player_name || player.full_name || 'Unknown';
}

function renderPlayerList(players) {
  const list = document.getElementById('playerList');
  
  if (!players || !Array.isArray(players)) {
    console.error('renderPlayerList: players is not an array', players);
    list.innerHTML = '<div class="empty-state">No players data</div>';
    return;
  }
  
  const searchTerm = document.getElementById('searchInput').value.toLowerCase();
  const positionFilter = document.getElementById('positionFilter').value;
  
  let filtered = players.filter(p => {
    const name = getPlayerName(p);
    return (!searchTerm || (name && name.toLowerCase().includes(searchTerm))) &&
           (!positionFilter || p.position === positionFilter);
  });
  
  filtered.sort((a, b) => {
    const countA = getReportsForPlayer(a.name).length;
    const countB = getReportsForPlayer(b.name).length;
    return countB - countA;
  });
  
  list.innerHTML = filtered.map(p => {
    const name = getPlayerName(p);
    let reportCount = 0;
    try {
      reportCount = getReportsForPlayer(name).length;
    } catch (e) {
      console.error('Error counting reports for', name, e);
    }
    return `
      <div class="player-item ${selectedPlayer?.id === p.id ? 'active' : ''}" onclick="selectPlayer(${JSON.stringify(p).replace(/"/g, '&quot;')})">
        <div class="player-name">${name}</div>
        <div class="player-meta">
          ${p.position || 'Pos?'} • ${p.age || '?'}
          <span class="report-count">${reportCount}</span>
        </div>
      </div>
    `;
  }).join('');
  
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">No players found</div>';
  }
}

function getWeightedLevelAverage(reports, levelField, playerPosition) {
  if (reports.length === 0) return { level: '-', score: 0, nextLevel: '-', distance: 0 };
  
  const levelScores = {
    'Premier League': 5,
    'Championship': 4,
    'Upper League': 4,
    'League One': 3,
    'Upper League 2': 3,
    'League Two': 2,
    'Lower League': 1,
    'Lower League 1': 1,
    'National League': 1,
  };
  
  const levelRanges = [
    { name: 'National League', min: 0, max: 1.5 },
    { name: 'League Two', min: 1.5, max: 2.5 },
    { name: 'League One', min: 2.5, max: 3.5 },
    { name: 'Championship', min: 3.5, max: 4.5 },
    { name: 'Premier League', min: 4.5, max: 5 },
  ];
  
  let totalWeight = 0;
  let weightedScore = 0;
  
  reports.forEach(r => {
    const level = r[levelField];
    if (!level) return;
    
    let score = 2;
    for (const [key, val] of Object.entries(levelScores)) {
      if (level.includes(key)) {
        score = val;
        break;
      }
    }
    
    const scoutRating = r.scout_rating || 1;
    const daysOld = Math.floor((new Date() - new Date(r.fixture_date)) / (1000 * 60 * 60 * 24));
    const timeDecay = Math.max(100, 450 - daysOld) / 450;
    const positionMultiplier = (r.report_position === playerPosition) ? 1 : 0.5;
    const weight = scoutRating * timeDecay * positionMultiplier;
    
    totalWeight += weight;
    weightedScore += score * weight;
  });
  
  if (totalWeight === 0) return { level: '-', score: 0, nextLevel: '-', distance: 0 };
  
  const avgScore = weightedScore / totalWeight;
  
  // Find current level and next level
  let currentLevel = '-';
  let nextLevel = '-';
  let currentMin = 0;
  let currentMax = 5;
  
  for (const range of levelRanges) {
    if (avgScore >= range.min && avgScore <= range.max) {
      currentLevel = range.name;
      currentMin = range.min;
      currentMax = range.max;
      break;
    }
  }
  
  // Find next level
  for (const range of levelRanges) {
    if (range.min > avgScore) {
      nextLevel = range.name;
      break;
    }
  }
  
  // Calculate 0-100 scale and distance to next
  const normalizedScore = ((avgScore - currentMin) / (currentMax - currentMin)) * 100;
  const distanceToNext = currentMax > avgScore ? ((currentMax - avgScore) / (currentMax - currentMin)) * 100 : 0;
  
  return {
    level: currentLevel,
    score: Math.round(normalizedScore),
    nextLevel: nextLevel || currentLevel,
    distance: Math.round(distanceToNext)
  };
}

function selectPlayer(player) {
  selectedPlayer = player;
  const name = getPlayerName(player);
  const position = player.position || 'Unknown';
  const reports = getReportsForPlayer(name);
  
  document.getElementById('noPlayerSelected').style.display = 'none';
  document.getElementById('playerDetail').style.display = 'block';
  document.getElementById('playerTitle').textContent = name;
  
  // Display player info
  document.getElementById('playerClub').textContent = player.club || '-';
  document.getElementById('playerPosition').textContent = position;
  document.getElementById('playerContract').textContent = player.contract_status || '-';
  document.getElementById('playerAge').textContent = player.age ? `${player.age} yrs` : '-';
  
  // Update stats
  document.getElementById('reportCount').textContent = reports.length;
  
  if (reports.length > 0) {
    const currentAvg = getWeightedLevelAverage(reports, 'current_playing_level', position);
    document.getElementById('avgCurrent').textContent = currentAvg.level;
    document.getElementById('avgCurrentScore').textContent = `${currentAvg.score}/100 → ${currentAvg.nextLevel}`;
    
    const potentialAvg = getWeightedLevelAverage(reports, 'potential_playing_level', position);
    document.getElementById('avgPotential').textContent = potentialAvg.level;
    document.getElementById('avgPotentialScore').textContent = `${potentialAvg.score}/100 → ${potentialAvg.nextLevel}`;
    
    const confidence = Math.min(100, reports.length * 10).toFixed(0) + '%';
    document.getElementById('confidence').textContent = confidence;
    
    // Render different tabs
    renderReports(reports);
    renderDataTab(player);
    renderAnalysisTab(player, reports);
  }
  
  renderPlayerList(allPlayers);
}

function renderAnalysisTab(player, reports) {
  const container = document.getElementById('analysisContent');
  
  // Show AI summary if available
  if (player.ai_analysis) {
    container.innerHTML = `
      <div style="background: #f0f7ff; border-left: 4px solid #0066cc; padding: 16px; border-radius: 4px;">
        <h3 style="margin: 0 0 12px 0; color: #0066cc;">🤖 AI Analysis Summary</h3>
        <div style="font-size: 13px; line-height: 1.6; color: #333; white-space: pre-wrap;">
          ${player.ai_analysis}
        </div>
      </div>
    `;
  } else {
    container.innerHTML = `
      <div class="empty-state">
        AI analysis not yet generated.<br>
        <small>Run: python3 generate_ai_analysis.py</small>
      </div>
    `;
  }
  
  // Add scout report summary
  if (reports.length > 0) {
    const verdicts = reports.map(r => r.verdict).filter(Boolean);
    const verdictCounts = {};
    verdicts.forEach(v => {
      verdictCounts[v] = (verdictCounts[v] || 0) + 1;
    });
    
    let verdictHTML = '<div style="margin-top: 20px;"><h3 style="margin: 0 0 10px 0;">📊 Scout Verdict Breakdown</h3>';
    verdictHTML += '<div style="font-size: 12px;">';
    
    Object.entries(verdictCounts).sort((a, b) => b[1] - a[1]).forEach(([verdict, count]) => {
      const pct = Math.round((count / verdicts.length) * 100);
      verdictHTML += `<div style="margin-bottom: 8px;">
        <div style="font-weight: 600;">${verdict}: ${count} scouts (${pct}%)</div>
        <div style="background: #e0e0e0; height: 4px; border-radius: 2px; margin-top: 2px;">
          <div style="background: ${count > verdicts.length/2 ? '#66bb6a' : '#ffa726'}; height: 100%; width: ${pct}%; border-radius: 2px;"></div>
        </div>
      </div>`;
    });
    
    verdictHTML += '</div></div>';
    container.innerHTML += verdictHTML;
  }
}

function renderDataTab(player) {

  // Check if player has SofaScore data

      <div class="empty-state">
        No SofaScore data available for this player yet.<br>
        <small>Data will be populated as it becomes available.</small>
      </div>
    `;
    return;
  }
  
  const stats = player.sofascore_stats;
  
  // Example stats structure - customize based on your data
  const statsList = [
    { name: 'Passing Accuracy', value: stats.passing_accuracy, z_score: stats.passing_z || 0, percentile: stats.passing_percentile || 0 },
    { name: 'Tackles', value: stats.tackles, z_score: stats.tackles_z || 0, percentile: stats.tackles_percentile || 0 },
    { name: 'Dribbles', value: stats.dribbles, z_score: stats.dribbles_z || 0, percentile: stats.dribbles_percentile || 0 },
    { name: 'Shots on Target', value: stats.shots_on_target, z_score: stats.shots_z || 0, percentile: stats.shots_percentile || 0 },
  ];
  
  container.innerHTML = statsList.map(stat => {
    if (!stat.value) return '';
    
    // Color code based on percentile: red (0-33), orange (33-66), green (66-100)
    let color = '#ef5350'; // red
    if (stat.percentile >= 66) color = '#66bb6a'; // green
    else if (stat.percentile >= 33) color = '#ffa726'; // orange
    
    return `
      <div class="stat-row">
        <div style="width: 120px;">
          <div class="stat-label">${stat.name}</div>
          <div class="stat-percentile">Z: ${stat.z_score.toFixed(2)} | ${stat.percentile}th %ile</div>
        </div>
        <div class="stat-bar-container">
          <div class="stat-bar" style="background: linear-gradient(90deg, #ef5350 0%, #ffa726 50%, #66bb6a 100%);">
            <div class="stat-bar-value" style="left: ${stat.percentile}%;">${stat.percentile}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderReports(reports) {
  const container = document.getElementById('reportsList');
  
  if (!reports || reports.length === 0) {
    container.innerHTML = '<div class="empty-state">No reports found for this player</div>';
    return;
  }
  
  try {
    container.innerHTML = reports.map(r => {
      const isUnassigned = r.player_name === 'UNASSIGNED';
      return `
    <div class="report-card ${isUnassigned ? 'unassigned' : ''}">
      <div class="report-header">
        <div class="report-scout">${(r.scout_first_name || '') + ' ' + (r.scout_last_name || '')}</div>
        <div class="report-date">${r.fixture_date ? new Date(r.fixture_date).toLocaleDateString() : 'No date'}</div>
      </div>
      
      <div class="report-position">
        ${r.report_position} ${r.form_id ? '| ' + r.form_id : ''}
        ${isUnassigned ? '<span style="color: #ff6b6b; font-weight: bold;"> [NEEDS PLAYER]</span>' : ''}
      </div>
      
      <div class="report-details">
        <div class="detail-item">
          <div class="detail-label">Current Level</div>
          <div class="detail-value">${r.current_playing_level || 'N/A'}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Potential Level</div>
          <div class="detail-value">${r.potential_playing_level || 'N/A'}</div>
        </div>
      </div>
      
      ${r.verdict ? `<div class="verdict-badge verdict-${getVerdictClass(r.verdict)}">${r.verdict}</div>` : ''}
      
      <button onclick="editReport(${r.id}, '${r.player_name}', '${r.fixture_date}')" style="margin-top: 10px; padding: 6px 12px; font-size: 11px;">✎ Edit</button>
      
      ${r.report_weight ? `<div class="report-weight">Weight: ${(r.report_weight * 100).toFixed(1)}%</div>` : ''}
    </div>
  `;
    }).join('');
  } catch (e) {
    console.error('Error rendering reports:', e);
    container.innerHTML = '<div class="empty-state">Error loading reports</div>';
  }
}

function getVerdictClass(verdict) {
  const v = verdict.toLowerCase();
  if (v.includes('sign') || v.includes('number 1')) return 'sign';
  if (v.includes('squad') || v.includes('watch again')) return 'watch';
  if (v.includes('forget')) return 'forget';
  return 'squad';
}

function switchTab(tabName) {
  // Hide all tabs
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  
  // Show selected tab
  document.getElementById(tabName).classList.add('active');
  event.target.classList.add('active');
  
  // Generate AI summary when Analysis tab is opened
  if (tabName === 'analysis' && selectedPlayer) {
    const name = getPlayerName(selectedPlayer);
    const reports = getReportsForPlayer(name);
    renderAnalysisTab(name, reports);
  }
}

async function renderAnalysisTab(playerName, reports) {
  const container = document.getElementById('analysisContent');
  
  if (reports.length === 0) {
    container.innerHTML = '<div class="empty-state">No reports to analyze</div>';
    return;
  }
  
  // Show loading state
  container.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;"><div style="font-size: 14px; margin-bottom: 10px;">🤖 Generating AI summary...</div><div style="font-size: 12px;">Analyzing scout verdicts...</div></div>';
  
  // Generate summary
  const summary = await generateAISummary(playerName, reports);
  
  // Verdict statistics
  const verdicts = reports.map(r => r.verdict).filter(Boolean);
  const signCount = verdicts.filter(v => v.includes('Sign')).length;
  const watchCount = verdicts.filter(v => v.includes('Watch')).length;
  const forgetCount = verdicts.filter(v => v.includes('Forget')).length;
  
  // Scout count
  const scouts = new Set(reports.map(r => `${r.scout_first_name} ${r.scout_last_name}`));
  
  // Consensus
  let consensus = '🟡 Mixed';
  if (signCount > watchCount + forgetCount) consensus = '🟢 Positive (Sign)';
  else if (forgetCount > watchCount + signCount) consensus = '🔴 Negative (Forget)';
  else if (watchCount > signCount + forgetCount) consensus = '🟡 Watch Again';
  
  container.innerHTML = `
    <div style="margin-bottom: 20px;">
      <h3 style="margin: 0 0 12px 0; font-size: 16px;">Scout Consensus</h3>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px;">
        <div style="background: #e8f5e9; padding: 12px; border-radius: 4px; text-align: center;">
          <div style="font-size: 24px; font-weight: 600; color: #4caf50;">${signCount}</div>
          <div style="font-size: 11px; color: #666; margin-top: 4px;">Sign / Positive</div>
        </div>
        <div style="background: #fff3e0; padding: 12px; border-radius: 4px; text-align: center;">
          <div style="font-size: 24px; font-weight: 600; color: #ff9800;">${watchCount}</div>
          <div style="font-size: 11px; color: #666; margin-top: 4px;">Watch Again</div>
        </div>
        <div style="background: #ffebee; padding: 12px; border-radius: 4px; text-align: center;">
          <div style="font-size: 24px; font-weight: 600; color: #f44336;">${forgetCount}</div>
          <div style="font-size: 11px; color: #666; margin-top: 4px;">Forget</div>
        </div>
      </div>
      <div style="background: #f0f4ff; padding: 12px; border-radius: 4px; border-left: 4px solid #0066cc; margin-bottom: 12px;">
        <div style="font-weight: 600; margin-bottom: 4px;">${consensus}</div>
        <div style="font-size: 12px; color: #666;">${reports.length} reports from ${scouts.size} scouts</div>
      </div>
    </div>
    
    <div style="margin-bottom: 20px;">
      <h3 style="margin: 0 0 12px 0; font-size: 16px;">AI Summary</h3>
      <div style="background: #f9f9f9; padding: 12px; border-radius: 4px; font-size: 13px; line-height: 1.6; color: #333; border-left: 4px solid #4caf50;">
        ${summary}
      </div>
    </div>
    
    <div>
      <h3 style="margin: 0 0 12px 0; font-size: 16px;">Recent Verdicts</h3>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        ${reports.slice(0, 5).map(r => `
          <div style="background: #f9f9f9; padding: 10px; border-radius: 4px; font-size: 12px;">
            <div style="font-weight: 600; margin-bottom: 4px;">${r.scout_first_name} ${r.scout_last_name}</div>
            <div style="color: #666; font-size: 11px; margin-bottom: 4px;">${new Date(r.fixture_date).toLocaleDateString()}</div>
            <div style="color: #333;">${r.verdict || 'No verdict'}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
